<script>
const MATERIAL_LABELS={solvent:'Base solvente',h2o:'Base H₂O',clear:'Transparente',primer:'Primer'};
const TABS={
  ext:{label:'Exterior',cls:'tab-ext',emoji:'🎨',footer:'EXTERIOR · 3:1:1',input:'¿Cuánta pintura tienes?',hint:'Proporción editable · Base solvente',placeholder:300,baseName:'Pintura',baseEmoji:'🎨',basePartName:'Pintura',material:'solvent',params:{minMl:50,paintParts:3,hardenerParts:1,thinnerParts:1},mode:null},
  int:{label:'Interior',cls:'tab-int',emoji:'🏠',footer:'INTERIOR · 20:1 + THINNER',input:'¿Cuánta pintura tienes?',hint:'Proporción editable · Noche/Día',placeholder:500,baseName:'Pintura',baseEmoji:'🎨',basePartName:'Pintura',material:'solvent',params:{minMl:50,paintParts:20,hardenerParts:1,nightPctMin:5,nightPctMax:6,dayPctMin:7,dayPctMax:10},mode:'night'},
  h2o:{label:'H₂O',cls:'tab-h2o',emoji:'💧',footer:'H₂O · 6:1 + AGUA',input:'¿Cuánta pintura H₂O tienes?',hint:'Proporción editable · Agua 5–20%',placeholder:400,baseName:'Pintura H₂O',baseEmoji:'💧',basePartName:'Pintura',material:'h2o',params:{minMl:50,paintParts:6,hardenerParts:1,nightPctMin:5,nightPctMax:18,dayPctMin:18,dayPctMax:20},mode:'night'},
  pri:{label:'Primer',cls:'tab-pri',emoji:'🟢',footer:'PRIMER · 15:1',input:'¿Cuánto primer tienes?',hint:'Proporción editable · Sin thinner',placeholder:300,baseName:'Primer',baseEmoji:'🟢',basePartName:'Primer',material:'primer',params:{minMl:50,paintParts:15,hardenerParts:1},mode:null},
  tra:{label:'Transp.',cls:'tab-tra',emoji:'✨',footer:'TRANSPARENTE · 10:1 + 5%',input:'¿Cuánto transparente tienes?',hint:'Proporción editable · 10:1 + thinner',placeholder:200,baseName:'Transparente',baseEmoji:'✨',basePartName:'Transp.',material:'clear',params:{minMl:50,paintParts:10,hardenerParts:1,thinnerPct:5},mode:null}
};
const GUN_DEFAULTS={
  '08':{name:'0.8 mm',icon:'🔧',badge:'Pistola 0.8',maxHvlp:null,note:'Ideal para retoques y piezas pequeñas. Si el material está espeso, reduce o cambia a boquilla mayor.',psi:{solvent:[18,22],h2o:[22,26],clear:[24,28],primer:[24,30]},turns:{solvent:'1.5 – 2 vueltas',h2o:'2 vueltas',clear:'2 vueltas',primer:'2.5 vueltas'},fan:{solvent:'Medio',h2o:'Medio-abierto',clear:'Medio-abierto',primer:'Medio'}},
  '14':{name:'1.4 HVLP',icon:'🔫',badge:'HVLP 1.4 genérica',maxHvlp:34,note:'Rangos de arranque para HVLP 1.4 genérica. Ajusta con gatillo jalado y prueba patrón antes de la pieza.',psi:{solvent:[24,28],h2o:[26,30],clear:[28,32],primer:[30,34]},turns:{solvent:'1.5 – 2 vueltas',h2o:'2 vueltas',clear:'2 – 2.5 vueltas',primer:'2.5 – 3 vueltas'},fan:{solvent:'Abierto casi completo',h2o:'Abierto casi completo',clear:'Abierto casi completo',primer:'Abierto completo'}},
  graco:{name:'Graco',icon:'🏆',badge:'Stellair ACE 1.4 HVLP',maxHvlp:34,note:'La Graco de las fotos trabaja como HVLP 1.4. Arranque recomendado: 34 PSI con gatillo jalado; baja sólo si atomiza bien. Para mantener HVLP, no rebases 34 PSI en esa tapa.',psi:{solvent:[30,34],h2o:[32,34],clear:[32,34],primer:[34,34]},turns:{solvent:'1.5 – 2 vueltas',h2o:'2 vueltas',clear:'2 – 2.5 vueltas',primer:'2.5 – 3 vueltas'},fan:{solvent:'Abierto casi completo',h2o:'Abierto casi completo',clear:'Abierto casi completo',primer:'Abierto completo'}}
};
const CLIMATES={normal:{label:'Normal',offset:0,note:'Sin ajuste automático.'},night:{label:'Noche / humedad alta',offset:1,note:'Sube un poco la atomización y usa capas ligeras con más tiempo de oreo.'},hot:{label:'Calor / seco',offset:-1,note:'Baja un poco la presión para reducir overspray y seca demasiado rápido.'},custom:{label:'Personalizado',offset:null,note:'Usa el ajuste PSI que tú escribas.'}};
let state={tab:'ext',mode:{int:'night',h2o:'night'},params:{},guns:{},climate:{},gunSelected:{ext:'08',int:'08',h2o:'08',pri:'08',tra:'08'}};

function clone(o){return JSON.parse(JSON.stringify(o));}
function q(id){return document.getElementById(id);}
function num(v,def=0){const n=parseFloat(v);return Number.isFinite(n)?n:def;}
function fmt(n){return Number(n).toFixed(1);}
function rangeText(a,b){return Math.abs(a-b)<0.001?fmt(a):fmt(a)+' – '+fmt(b);}
function save(){localStorage.setItem('rogPaintProV1',JSON.stringify(state));}
function load(){
  Object.keys(TABS).forEach(t=>state.params[t]=clone(TABS[t].params));
  state.guns=clone(GUN_DEFAULTS);
  Object.keys(TABS).forEach(t=>state.climate[t]={type:'normal',offset:0});
  try{const raw=localStorage.getItem('rogPaintProV1');if(raw){const old=JSON.parse(raw);state={...state,...old};}}
  catch(e){}
  Object.keys(TABS).forEach(t=>{state.params[t]={...clone(TABS[t].params),...(state.params[t]||{})};state.climate[t]={type:'normal',offset:0,...(state.climate[t]||{})};});
  state.guns={...clone(GUN_DEFAULTS),...(state.guns||{})};
}
function buildNav(){
  const nav=q('navInner');nav.innerHTML='';
  Object.entries(TABS).forEach(([key,t])=>{
    const b=document.createElement('button');b.className='nav-btn'+(key===state.tab?' active':'');b.textContent=t.emoji+' '+t.label;b.onclick=()=>switchTab(key);nav.appendChild(b);
  });
}
function buildPanels(){
  const app=q('appPanels');app.innerHTML='';
  Object.entries(TABS).forEach(([key,t])=>{
    const p=document.createElement('section');p.className='tab-panel'+(key===state.tab?' active':'');p.id='panel-'+key;
    p.innerHTML=panelHtml(key,t);app.appendChild(p);renderGun(key);
  });
}
function pillsHtml(key){
  const p=state.params[key];
  if(key==='ext')return `<div class="ratio-pills"><div class="rp"><span class="rp-top">×${p.paintParts}</span>Pintura</div><div class="rp"><span class="rp-top">×${p.hardenerParts}</span>Hardener</div><div class="rp"><span class="rp-top">×${p.thinnerParts}</span>Thinner</div></div>`;
  if(key==='pri')return `<div class="ratio-pills"><div class="rp"><span class="rp-top">×${p.paintParts}</span>Primer</div><div class="rp"><span class="rp-top">×${p.hardenerParts}</span>Hardener</div></div>`;
  if(key==='tra')return `<div class="ratio-pills"><div class="rp"><span class="rp-top">×${p.paintParts}</span>Transp.</div><div class="rp"><span class="rp-top">×${p.hardenerParts}</span>Hardener</div><div class="rp"><span class="rp-top">${p.thinnerPct}%</span>Thinner</div></div>`;
  return '';
}
function modeHtml(key){
  if(!TABS[key].mode)return '';
  const noun=key==='h2o'?'Agua':'Thinner';
  const p=state.params[key], m=state.mode[key];
  return `<div class="mode-row">
    <button class="mode-btn ${m==='night'?'active':''}" onclick="setMode('${key}','night')"><span class="mode-top">🌙 ${p.nightPctMin}–${p.nightPctMax}%</span><span class="mode-sub">NOCHE</span></button>
    <button class="mode-btn ${m==='day'?'active':''}" onclick="setMode('${key}','day')"><span class="mode-top">☀️ ${p.dayPctMin}–${p.dayPctMax}%</span><span class="mode-sub">DÍA</span></button>
    <button class="mode-btn ${m==='both'?'active':''}" onclick="setMode('${key}','both')"><span class="mode-top">⚡ AMBOS</span><span class="mode-sub">${noun}</span></button>
  </div>`;
}
function paramHtml(key){
  const p=state.params[key];
  let fields=`
    <div class="p-field"><label>Mínimo ML</label><input type="number" step="1" value="${p.minMl}" onchange="setParam('${key}','minMl',this.value)"></div>
    <div class="p-field"><label>Partes base</label><input type="number" step="0.1" value="${p.paintParts}" onchange="setParam('${key}','paintParts',this.value)"></div>
    <div class="p-field"><label>Partes hardener</label><input type="number" step="0.1" value="${p.hardenerParts}" onchange="setParam('${key}','hardenerParts',this.value)"></div>`;
  if(key==='ext')fields+=`<div class="p-field"><label>Partes thinner</label><input type="number" step="0.1" value="${p.thinnerParts}" onchange="setParam('${key}','thinnerParts',this.value)"></div>`;
  if(key==='tra')fields+=`<div class="p-field"><label>% thinner</label><input type="number" step="0.1" value="${p.thinnerPct}" onchange="setParam('${key}','thinnerPct',this.value)"></div>`;
  if(key==='int'||key==='h2o')fields+=`
    <div class="p-field"><label>% noche mínimo</label><input type="number" step="0.1" value="${p.nightPctMin}" onchange="setParam('${key}','nightPctMin',this.value)"></div>
    <div class="p-field"><label>% noche máximo</label><input type="number" step="0.1" value="${p.nightPctMax}" onchange="setParam('${key}','nightPctMax',this.value)"></div>
    <div class="p-field"><label>% día mínimo</label><input type="number" step="0.1" value="${p.dayPctMin}" onchange="setParam('${key}','dayPctMin',this.value)"></div>
    <div class="p-field"><label>% día máximo</label><input type="number" step="0.1" value="${p.dayPctMax}" onchange="setParam('${key}','dayPctMax',this.value)"></div>`;
  return `<details class="param-box"><summary>⚙️ Modificar parámetros de mezcla</summary><div class="param-grid">${fields}<div class="p-help">Todo queda guardado en este equipo. Si cambias por marca, clima o viscosidad, la calculadora recalcula con tus nuevos valores.</div></div></details>`;
}
function climateHtml(key){
  const c=state.climate[key];
  const note=CLIMATES[c.type]?.note||CLIMATES.normal.note;
  return `<div class="climate-box">
    <div class="climate-title">🌙 Ajuste rápido por clima / turno</div>
    <div class="climate-grid">
      <div class="p-field"><label>Condición</label><select onchange="setClimate('${key}',this.value)">
        ${Object.entries(CLIMATES).map(([v,o])=>`<option value="${v}" ${c.type===v?'selected':''}>${o.label}</option>`).join('')}
      </select></div>
      <div class="p-field"><label>Ajuste PSI</label><input type="number" step="0.5" value="${c.offset}" onchange="setPsiOffset('${key}',this.value)"></div>
      <div class="climate-note"><strong>Nota:</strong> ${note} La presión mostrada se calcula con el gatillo jalado.</div>
    </div>
  </div>`;
}
function panelHtml(key,t){
  return `${pillsHtml(key)}
  <div class="input-block">
    <label class="input-lbl" for="${key}-in">${t.emoji} ${t.input}</label>
    <div class="input-hint" id="${key}-hint">Mínimo ${state.params[key].minMl} ML · ${t.hint}</div>
    <div class="input-row"><input class="num-input" type="number" id="${key}-in" placeholder="${t.placeholder}" inputmode="decimal" autocomplete="off" oninput="calc('${key}')"><span class="unit-lbl">ML</span></div>
  </div>
  ${modeHtml(key)}
  ${paramHtml(key)}
  ${climateHtml(key)}
  <div id="${key}-warn" class="warn-min">⚠️ Ingresa mínimo ${state.params[key].minMl} ML</div>
  <div id="${key}-out" class="hidden">
    <div class="results" id="${key}-results"></div>
    <div class="total-row"><span class="total-lbl">Total mezcla</span><span class="total-val" id="${key}-tot">— ML</span></div>
    <div class="prop-bar" id="${key}-prop"></div>
    <div class="psi-box" id="${key}-psi-summary"></div>
    <div class="gun-schema">
      <div class="gun-schema-title">🔫 Configuración editable por pistola · sin aerógrafo</div>
      <div class="gun-tabs" id="${key}-gun-tabs"></div>
      <div id="${key}-gun-panel"></div>
    </div>
    <button class="reset-btn" onclick="resetTab('${key}')">↺ Limpiar</button>
  </div>
  <div class="footer">VOLPAINT · ${t.footer}</div>`;
}
function switchTab(key){
  state.tab=key;save();
  Object.values(TABS).forEach(t=>document.body.classList.remove(t.cls));document.body.classList.add(TABS[key].cls);q('topBadge').textContent=TABS[key].label;
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));q('panel-'+key).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach((b,i)=>b.classList.toggle('active',Object.keys(TABS)[i]===key));
}
function setMode(key,mode){state.mode[key]=mode;save();rebuildKeepValues(key);}
function setParam(key,name,value){state.params[key][name]=num(value,state.params[key][name]);save();rebuildKeepValues(key);}
function setClimate(key,type){const o=CLIMATES[type]||CLIMATES.normal;state.climate[key].type=type;if(o.offset!==null)state.climate[key].offset=o.offset;save();rebuildKeepValues(key);}
function setPsiOffset(key,value){state.climate[key].offset=num(value,0);state.climate[key].type='custom';save();rebuildKeepValues(key);}
function rebuildKeepValues(key){const old=q(key+'-in')?.value||'';q('panel-'+key).innerHTML=panelHtml(key,TABS[key]);q(key+'-in').value=old;renderGun(key);calc(key);}
function calc(key){
  const v=num(q(key+'-in').value,0), p=state.params[key], t=TABS[key];
  const warn=q(key+'-warn'), out=q(key+'-out');
  warn.textContent=`⚠️ Ingresa mínimo ${p.minMl} ML`;
  if(!v||v<=0){warn.classList.remove('show');out.classList.add('hidden');return;}
  if(v<p.minMl){warn.classList.add('show');out.classList.add('hidden');return;}
  warn.classList.remove('show');out.classList.remove('hidden');
  const one=v/p.paintParts; const hard=one*p.hardenerParts; let rows=[]; let total=v+hard;
  rows.push({name:t.baseName,sub:`Base · ×${p.paintParts}`,emoji:t.baseEmoji,val:fmt(v),cls:''});
  rows.push({name:'Hardener',sub:`Agregar · ×${p.hardenerParts}`,emoji:'⚗️',val:fmt(hard),cls:'c-hard'});
  if(key==='ext'){
    const th=one*p.thinnerParts;total+=th;rows.push({name:'Thinner',sub:`Agregar · ×${p.thinnerParts}`,emoji:'🪣',val:fmt(th),cls:'c-thin'});
  }
  if(key==='tra'){
    const th=(v+hard)*(p.thinnerPct/100);total+=th;rows.push({name:'Thinner',sub:`Agregar · ${p.thinnerPct}%`,emoji:'🪣',val:fmt(th),cls:'c-thin'});
  }
  if(key==='int'||key==='h2o'){
    const noun=key==='h2o'?'Agua':'Thinner', emo=key==='h2o'?'💧':'🪣';
    const base=v+hard;
    const rn=[base*p.nightPctMin/100,base*p.nightPctMax/100];
    const rd=[base*p.dayPctMin/100,base*p.dayPctMax/100];
    if(state.mode[key]==='night'){rows.push({name:noun,sub:`Noche · ${p.nightPctMin}–${p.nightPctMax}%`,emoji:emo,val:rangeText(rn[0],rn[1]),cls:key==='h2o'?'c-water':'c-thin'});total=base+(rn[0]+rn[1])/2;}
    else if(state.mode[key]==='day'){rows.push({name:noun,sub:`Día · ${p.dayPctMin}–${p.dayPctMax}%`,emoji:emo,val:rangeText(rd[0],rd[1]),cls:key==='h2o'?'c-water':'c-thin'});total=base+(rd[0]+rd[1])/2;}
    else{rows.push({name:noun+' noche',sub:`${p.nightPctMin}–${p.nightPctMax}%`,emoji:emo,val:rangeText(rn[0],rn[1]),cls:key==='h2o'?'c-water':'c-thin'});rows.push({name:noun+' día',sub:`${p.dayPctMin}–${p.dayPctMax}%`,emoji:emo,val:rangeText(rd[0],rd[1]),cls:key==='h2o'?'c-water':'c-thin'});total=base+(rn[0]+rn[1]+rd[0]+rd[1])/4;}
  }
  q(key+'-results').innerHTML=rows.map(r=>`<div class="result-card ${r.cls}"><div class="rc-left"><div class="rc-emoji">${r.emoji}</div><div><div class="rc-name">${r.sub}</div><div class="rc-desc">${r.name}</div></div></div><div class="rc-right"><div class="rc-val">${r.val}</div><div class="rc-unit">ML</div></div></div>`).join('');
  q(key+'-tot').textContent=fmt(total)+' ML'+((key==='int'||key==='h2o')?' aprox':'');
  renderProp(key);renderPsiSummary(key);
}
function renderProp(key){
  const p=state.params[key]; let segments=[],keys=[];
  if(key==='ext'){segments=[[p.paintParts,'var(--c1)'],[p.hardenerParts,'#3b82f6'],[p.thinnerParts,'#f59e0b']];keys=[`${TABS[key].basePartName} ×${p.paintParts}`,`Hardener ×${p.hardenerParts}`,`Thinner ×${p.thinnerParts}`];}
  else if(key==='pri'){segments=[[p.paintParts,'var(--c1)'],[p.hardenerParts,'#3b82f6']];keys=[`Primer ×${p.paintParts}`,`Hardener ×${p.hardenerParts}`];}
  else if(key==='tra'){segments=[[p.paintParts,'var(--c1)'],[p.hardenerParts,'#3b82f6'],[p.thinnerPct/10,'#f59e0b']];keys=[`Transp. ×${p.paintParts}`,`Hardener ×${p.hardenerParts}`,`Thinner ${p.thinnerPct}%`];}
  else{segments=[[p.paintParts,'var(--c1)'],[p.hardenerParts,'#3b82f6'],[1,'#06b6d4']];keys=[`${TABS[key].basePartName} ×${p.paintParts}`,`Hardener ×${p.hardenerParts}`,key==='h2o'?'Agua %':'Thinner %'];}
  q(key+'-prop').innerHTML=`<div class="prop-lbl">Proporción visual editable</div><div class="prop-track">${segments.map(s=>`<div class="pf" style="background:${s[1]};flex:${s[0]}"></div>`).join('')}</div><div class="prop-key">${keys.map((k,i)=>`<div class="pk"><div class="pd" style="background:${segments[i][1]}"></div>${k}</div>`).join('')}</div>`;
}
function effectiveRange(gunKey,mat,key){
  const base=state.guns[gunKey].psi[mat];let a=num(base[0]),b=num(base[1]);
  const off=num(state.climate[key].offset,0);a+=off;b+=off;
  const max=state.guns[gunKey].maxHvlp;
  if(max){a=Math.min(a,max);b=Math.min(b,max);}return [Math.max(0,a),Math.max(0,b)];
}
function renderPsiSummary(key){
  const gun=state.gunSelected[key], mat=TABS[key].material, r=effectiveRange(gun,mat,key);
  q(key+'-psi-summary').innerHTML=`🔫 <strong>${state.guns[gun].badge} · ${MATERIAL_LABELS[mat]}:</strong> ${rangeText(r[0],r[1])} PSI con gatillo jalado`;
}
function renderGun(key){
  const tabs=q(key+'-gun-tabs'), panel=q(key+'-gun-panel');if(!tabs||!panel)return;
  tabs.innerHTML=Object.entries(state.guns).map(([g,data])=>`<button class="gun-tab ${state.gunSelected[key]===g?'active':''}" onclick="selectGun('${key}','${g}')"><span class="gun-tab-icon">${data.icon}</span>${data.name}</button>`).join('');
  const gkey=state.gunSelected[key]; const gun=state.guns[gkey]; const mat=TABS[key].material;
  const rows=Object.keys(MATERIAL_LABELS).map(m=>{
    const eff=effectiveRange(gkey,m,key); const raw=gun.psi[m];
    return `<div class="gun-row ${m===mat?'active-material':''}"><span class="gun-row-label">${MATERIAL_LABELS[m]}</span><span class="gun-row-val accent" data-eff="${gkey}-${m}">${rangeText(eff[0],eff[1])} PSI</span><div class="edit-line"><input class="mini-input" type="number" step="0.5" value="${raw[0]}" onchange="setGunPsi('${key}','${gkey}','${m}',0,this.value)"><input class="mini-input" type="number" step="0.5" value="${raw[1]}" onchange="setGunPsi('${key}','${gkey}','${m}',1,this.value)"></div></div>`;
  }).join('');
  const turnRows=Object.keys(MATERIAL_LABELS).map(m=>`<div class="gun-row ${m===mat?'active-material':''}"><span class="gun-row-label">${MATERIAL_LABELS[m]}</span><span class="gun-row-val">Vueltas</span><div class="edit-line"><input class="text-input" type="text" value="${gun.turns[m]}" onchange="setGunText('${key}','${gkey}','turns','${m}',this.value)"></div></div>`).join('');
  const fanRows=Object.keys(MATERIAL_LABELS).map(m=>`<div class="gun-row ${m===mat?'active-material':''}"><span class="gun-row-label">${MATERIAL_LABELS[m]}</span><span class="gun-row-val">Abanico</span><div class="edit-line"><input class="text-input" type="text" value="${gun.fan[m]}" onchange="setGunText('${key}','${gkey}','fan','${m}',this.value)"></div></div>`).join('');
  const rec=effectiveRange(gkey,mat,key);
  panel.innerHTML=`<div class="gun-card"><div class="gun-card-header"><span class="gun-card-title">PSI · Material</span><span class="gun-card-badge">${gun.badge}</span></div><div class="gun-rows">${rows}</div><div class="small-note"><strong>Base:</strong> los cuadros editables son tu rango base. El valor grande suma el ajuste de clima y respeta el máximo HVLP cuando aplica.</div></div>
  <div class="gun-card"><div class="gun-card-header"><span class="gun-card-title">Vueltas por material</span><span class="gun-card-badge">Editable</span></div><div class="gun-rows">${turnRows}</div></div>
  <div class="gun-card"><div class="gun-card-header"><span class="gun-card-title">Abanico por material</span><span class="gun-card-badge">Editable</span></div><div class="gun-rows">${fanRows}</div></div>
  <div class="gun-config"><div class="gun-config-title">⭐ Config recomendada para esta sección</div>
    <div class="gun-config-row"><span class="gun-config-label">Material</span><span class="gun-config-val">${MATERIAL_LABELS[mat]}</span></div>
    <div class="gun-config-row"><span class="gun-config-label">PSI calculado</span><span class="gun-config-val">${rangeText(rec[0],rec[1])} PSI</span></div>
    <div class="gun-config-row"><span class="gun-config-label">Vueltas</span><span class="gun-config-val">${gun.turns[mat]}</span></div>
    <div class="gun-config-row"><span class="gun-config-label">Abanico</span><span class="gun-config-val">${gun.fan[mat]}</span></div>
    <div class="gun-config-row"><span class="gun-config-label">Distancia</span><span class="gun-config-val">15–20 cm</span></div>
    <div class="small-note"><strong>Nota:</strong> ${gun.note}</div>
  </div><button class="edit-btn warning" onclick="restoreGun('${key}','${gkey}')">↺ Restaurar esta pistola</button>`;
  if(q(key+'-out')&&!q(key+'-out').classList.contains('hidden'))renderPsiSummary(key);
}
function selectGun(key,g){state.gunSelected[key]=g;save();renderGun(key);calc(key);}
function setGunPsi(key,g,m,i,value){state.guns[g].psi[m][i]=num(value,state.guns[g].psi[m][i]);if(state.guns[g].psi[m][0]>state.guns[g].psi[m][1])state.guns[g].psi[m].sort((a,b)=>a-b);save();renderGun(key);calc(key);}
function setGunText(key,g,group,m,value){state.guns[g][group][m]=value.trim()||GUN_DEFAULTS[g][group][m];save();renderGun(key);}
function restoreGun(key,g){state.guns[g]=clone(GUN_DEFAULTS[g]);save();renderGun(key);calc(key);}
function resetTab(key){q(key+'-in').value='';q(key+'-warn').classList.remove('show');q(key+'-out').classList.add('hidden');}
function init(){load();buildNav();buildPanels();Object.keys(TABS).forEach(calc);switchTab(state.tab||'ext');}
window.addEventListener('load',init);
</script>

<script>
(function(){
  if(!('serviceWorker' in navigator))return;
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      if(navigator.onLine&&reg.update){reg.update().catch(function(){});}
      reg.addEventListener('updatefound',function(){var nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',function(){if(nw.state==='installed'&&navigator.serviceWorker.controller){nw.postMessage({type:'SKIP_WAITING'});}});});
    }).catch(function(err){console.log('Service Worker no registrado:',err);});
  });
  var refreshing=false;navigator.serviceWorker.addEventListener('controllerchange',function(){if(refreshing)return;refreshing=true;window.location.reload();});
})();
</script>
